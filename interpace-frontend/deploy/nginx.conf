# 前端容器的 Nginx 配置（T11.3）
#
# 职责：托管 dist/ 静态文件 + 把 /api 反代到后端容器。
# 浏览器只看到同源地址，所以不需要额外的 CORS 配置。
#
# `backend` 是 docker-compose 里后端服务的名字，改名要同步改这里。

server {
    listen 80;
    server_name _;

    # Docker 内置 DNS。**必须配这个**：nginx 只在启动时解析一次上游主机名，
    # 之后会把 IP 缓存在内存里。发版时如果只重建了后端（很常见——只改了后端镜像），
    # 后端容器会拿到新 IP，而 nginx 还往旧 IP 上转发，表现是**持续 502**，
    # 直到手动重启 nginx 才恢复。
    # 配合下面的 `proxy_pass http://$upstream:8000`（用变量）才会在运行时重新解析，
    # valid=10s 表示最多 10 秒后就能切到新 IP。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 上游地址放进变量（见上面 resolver 的说明）。
    # `backend` 是 docker-compose 里后端服务的名字，改名要同步改这里。
    set $upstream_backend backend;

    # 还原真实客户端 IP。
    #
    # 为什么必须做：接在 Nginx Proxy Manager（或任何反向代理）后面时，
    # `$remote_addr` 是**上一跳代理的地址**（NPM 容器），而不是用户地址。
    # 而下面几处 `proxy_set_header X-Real-IP $remote_addr` 会把这个代理地址
    # 当作客户端 IP 发给后端 —— 后端按 IP 算配额，结果就是**所有访客共用一个配额桶**，
    # 第一个人的用量算到所有人头上（现象：别人还没怎么用就被拦）。
    #
    # 用 realip 模块把 `$remote_addr` 换成 X-Forwarded-For 里的真实客户端地址，
    # 这样后面那几行转发头写出去的才是对的。
    #
    # ⚠️ 安全前提：这里信任的是**内网网段**，攻击者如果能让请求带上伪造的
    # X-Forwarded-For，就能伪造 IP 绕过按 IP 的配额。所以必须保证
    # **只有自己的代理能连到本容器的 80 端口**——compose 里把前端端口绑在
    # `127.0.0.1:xxxx`（配合 NPM 的部署方式）正是为了这个。不要把它发布到公网。
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # 上传附件的体积上限。面试录音、PDF 简历都可能不小，
    # 默认的 1m 会让上传直接 413。
    client_max_body_size 100m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # 带内容 hash 的产物：可以长期强缓存，发版靠文件名变化失效。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 必须不缓存，否则用户会一直拿到旧版本引用的旧 chunk。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SSE 流式对话：**必须关掉代理缓冲**。
    # 开着缓冲时 Nginx 会攒够一批才转发，前端看到的就是"卡住不动，最后一次性出现",
    # 打字机效果直接失效。
    location ~ ^/api/v1/sessions/[0-9]+/stream-chat$ {
        proxy_pass http://$upstream_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 用 $remote_addr **覆盖**转发头，而不是 $proxy_add_x_forwarded_for。
        # 后者会保留客户端自己传来的值（在末尾追加真实 IP），等于把一个可以随便伪造的
        # 字符串带到了后端。覆盖之后，后端看到的值永远只有一个，且必然是我们的代理写进去的。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        # 模型一次回答可能很久，读超时要给足。
        proxy_read_timeout 300s;
    }

    # 语音面试 WebSocket：**必须转发 Upgrade 头并允许 HTTP/1.1**。
    # 少了这两行，握手会被 Nginx 直接拒掉，前端只看到"连接失败"。
    # 本地开发是靠 Vite 代理的 ws:true 顶上的，线上没有这层兜底。
    location ~ ^/api/v1/sessions/[0-9]+/speech/stream$ {
        proxy_pass http://$upstream_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖，理由同上
        proxy_set_header X-Forwarded-Proto $scheme;
        # 一场面试可能持续很久，连接别被中途掐断。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其余业务接口：路径原样转发（后端自己带 /api/v1 前缀，这里不做改写）。
    location /api/ {
        proxy_pass http://$upstream_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖，理由同 SSE 那段
        proxy_set_header X-Forwarded-Proto $scheme;
        # 复盘 / 评分 / 导出 Word 这类同步接口本身就慢，超时给宽一点。
        proxy_read_timeout 300s;
    }

    # 单页应用：找不到的路径一律回 index.html，交给前端路由处理。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
